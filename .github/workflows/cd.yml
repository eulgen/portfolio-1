name: cd

on:
  workflow_run:
    workflows: ["ci"]
    branches: [main]
    types: [completed]

# concurrency:
#   group: production-deployment
#   cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Connexion au registre GitHub (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build de l'image Docker
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
          docker build -t "$IMAGE_NAME" .

      - name: Push de l'image Docker sur GHCR
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
          docker push "$IMAGE_NAME"

      - name: Déploiement sur le VPS en SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            TARGET_DIR="${{ secrets.VPS_PROJECT_PATH || '/var/www/portfolio' }}"
            IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE_NAME"
            docker compose up -d --remove-orphans
            docker image prune -f
